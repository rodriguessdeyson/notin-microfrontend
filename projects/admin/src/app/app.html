<div class="admin-app min-h-screen text-slate-50">
  <header class="border-b border-white/10 bg-slate-950/80 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
      <div>
        <p class="section-kicker text-cyan-300">Remoto Admin</p>
        <h1 class="mt-2 text-2xl font-semibold text-white">Gestao de Tarefas</h1>
      </div>

      <nav class="flex items-center gap-2 text-sm">
        <a
          routerLink="/"
          routerLinkActive="bg-white/10 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-full px-4 py-2 text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          Painel
        </a>
        <a
          routerLink="/resumo-status"
          routerLinkActive="bg-white/10 text-white"
          class="rounded-full px-4 py-2 text-slate-300 transition hover:bg-white/10 hover:text-white"
        >
          Visualizacao do Fragmento
        </a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-10">
    <router-outlet />
  </main>
</div>
